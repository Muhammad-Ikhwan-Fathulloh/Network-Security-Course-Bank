services:
  attacker-l3:
    image: kalilinux/kali-rolling:latest
    container_name: attacker-l3
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    stdin_open: true
    tty: true
    volumes:
      - ./scripts:/tmp/scripts
      - ./captures:/tmp/captures
    networks:
      - l3-lab

  target-l3:
    image: ubuntu:22.04
    container_name: target-l3
    privileged: true
    cap_add:
      - NET_ADMIN
    stdin_open: true
    tty: true
    networks:
      - l3-lab
    command: sleep infinity

  monitor-l3:
    image: kalilinux/kali-rolling:latest
    container_name: monitor-l3
    cap_add:
      - NET_ADMIN
    stdin_open: true
    tty: true
    volumes:
      - ./captures:/tmp/captures
    networks:
      - l3-lab
    command: sleep infinity

networks:
  l3-lab:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.50.0/24
