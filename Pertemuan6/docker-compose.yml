services:
  attacker-l4:
    image: kalilinux/kali-rolling:latest
    container_name: attacker-l4
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    stdin_open: true
    tty: true
    volumes:
      - ./scripts:/tmp/scripts
      - ./captures:/tmp/captures
    networks:
      - l4-lab

  target-webserver:
    image: ubuntu:22.04
    container_name: target-webserver-l4
    privileged: true
    cap_add:
      - NET_ADMIN
    stdin_open: true
    tty: true
    volumes:
      - ./captures:/var/log
    networks:
      - l4-lab
    ports:
      - "8080:80"
    command: sleep infinity

  target-udp:
    image: ubuntu:22.04
    container_name: target-udp-service
    cap_add:
      - NET_ADMIN
    stdin_open: true
    tty: true
    networks:
      - l4-lab
    ports:
      - "5354:5354/udp"
    command: sleep infinity

  monitor-l4:
    image: kalilinux/kali-rolling:latest
    container_name: monitor-l4
    cap_add:
      - NET_ADMIN
    stdin_open: true
    tty: true
    volumes:
      - ./captures:/tmp/captures
    networks:
      - l4-lab
    command: sleep infinity

networks:
  l4-lab:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.60.0/24
