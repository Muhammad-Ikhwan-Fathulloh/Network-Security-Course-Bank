services:
  kali-wireless:
    image: kalilinux/kali-rolling:latest
    container_name: kali-wireless-lab
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    stdin_open: true
    tty: true
    volumes:
      - ./captures:/tmp/captures
      - ./wordlists:/tmp/wordlists
    networks:
      - wireless-lab

  monitor-wireless:
    image: kalilinux/kali-rolling:latest
    container_name: monitor-wireless
    cap_add:
      - NET_ADMIN
    stdin_open: true
    tty: true
    volumes:
      - ./captures:/tmp/captures
    networks:
      - wireless-lab
    command: sleep infinity

networks:
  wireless-lab:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/24
