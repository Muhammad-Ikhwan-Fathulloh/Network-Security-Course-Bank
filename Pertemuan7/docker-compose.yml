services:
  attacker-dns:
    image: kalilinux/kali-rolling:latest
    container_name: attacker-dns
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    stdin_open: true
    tty: true
    volumes:
      - ./scripts:/tmp/dns-scripts
      - ./captures:/tmp/captures
    networks:
      - dns-lab

  dns-resolver:
    image: ubuntu:22.04
    container_name: dns-resolver-target
    privileged: true
    cap_add:
      - NET_ADMIN
    stdin_open: true
    tty: true
    networks:
      - dns-lab
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    command: sleep infinity

  dns-auth:
    image: ubuntu:22.04
    container_name: dns-auth-server
    privileged: true
    cap_add:
      - NET_ADMIN
    stdin_open: true
    tty: true
    networks:
      - dns-lab
    ports:
      - "5355:5355/udp"
      - "5355:5355/tcp"
    command: sleep infinity

  web-target:
    image: ubuntu:22.04
    container_name: web-dns-target
    stdin_open: true
    tty: true
    networks:
      - dns-lab
    ports:
      - "8081:80"
    command: sleep infinity

  client-dns:
    image: ubuntu:22.04
    container_name: client-dns
    stdin_open: true
    tty: true
    networks:
      - dns-lab
    command: sleep infinity

  monitor-dns:
    image: kalilinux/kali-rolling:latest
    container_name: monitor-dns
    cap_add:
      - NET_ADMIN
    stdin_open: true
    tty: true
    volumes:
      - ./captures:/tmp/captures
    networks:
      - dns-lab
    command: sleep infinity

networks:
  dns-lab:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.70.0/24
